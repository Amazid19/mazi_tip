<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mazi_tip - Send Crypto Tips</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-blue-50 min-h-screen flex items-center justify-center p-0 sm:p-4">

    <div class="w-full min-h-screen sm:min-h-0 sm:max-w-md bg-white sm:rounded-2xl shadow-none sm:shadow-xl p-6 flex flex-col justify-between border-0 sm:border border-blue-100">
        
        <div>
            <!-- Header & Wallet Status -->
            <div class="flex items-center justify-between mb-6">
                <div>
                    <h1 class="text-2xl font-black text-gray-900 tracking-tight">mazi_tip</h1>
                    <p class="text-xs text-gray-400 font-medium uppercase tracking-widest mt-1">tap/tip/send</p>
                </div>
                <button id="walletBtn" onclick="toggleWallet()" class="px-3 py-1.5 bg-blue-50 hover:bg-blue-100 border border-blue-200 text-blue-700 text-xs font-semibold rounded-xl transition">
                    Connect Wallet
                </button>
            </div>

            <p class="text-xs text-gray-500 mb-6 bg-blue-50/80 py-2 px-3 rounded-lg border border-blue-100/50 text-center">
                Tip Arc Testnet USDC securely using your connected wallet.
            </p>

            <!-- Token Selection Dropdown -->
            <div class="mb-4">
                <label class="block text-xs font-semibold text-gray-500 uppercase mb-2">Select Token</label>
                <select id="tokenSelect" onchange="handleTokenChange()" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-gray-800 font-medium focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
                    <option value="USDC">USDC (Arc Testnet)</option>
                    <option value="ETH">ETH</option>
                    <option value="SOL">SOL</option>
                </select>
            </div>

            <!-- Preset Amounts (USDC) -->
            <div id="presetSection" class="mb-4">
                <label class="block text-xs font-semibold text-gray-500 uppercase mb-2">Preset Amounts (USDC)</label>
                <div class="grid grid-cols-4 gap-2">
                    <button type="button" onclick="setAmount(1)" class="py-2.5 bg-gray-50 hover:bg-blue-50 hover:border-blue-500 hover:text-blue-600 border border-gray-200 rounded-xl font-semibold text-gray-700 transition">1</button>
                    <button type="button" onclick="setAmount(2)" class="py-2.5 bg-gray-50 hover:bg-blue-50 hover:border-blue-500 hover:text-blue-600 border border-gray-200 rounded-xl font-semibold text-gray-700 transition">2</button>
                    <button type="button" onclick="setAmount(2.5)" class="py-2.5 bg-gray-50 hover:bg-blue-50 hover:border-blue-500 hover:text-blue-600 border border-gray-200 rounded-xl font-semibold text-gray-700 transition">2.5</button>
                    <button type="button" onclick="setAmount(1.5)" class="py-2.5 bg-gray-50 hover:bg-blue-50 hover:border-blue-500 hover:text-blue-600 border border-gray-200 rounded-xl font-semibold text-gray-700 transition">1.5</button>
                    <button type="button" onclick="setAmount(3)" class="py-2.5 bg-gray-50 hover:bg-blue-50 hover:border-blue-500 hover:text-blue-600 border border-gray-200 rounded-xl font-semibold text-gray-700 transition">3</button>
                    <button type="button" onclick="setAmount(5)" class="py-2.5 bg-gray-50 hover:bg-blue-50 hover:border-blue-500 hover:text-blue-600 border border-gray-200 rounded-xl font-semibold text-gray-700 transition">5</button>
                </div>
            </div>

            <!-- Custom Amount Input -->
            <div class="mb-6">
                <label class="block text-xs font-semibold text-gray-500 uppercase mb-2">Amount</label>
                <input type="number" id="customAmount" placeholder="0.00" class="w-full bg-gray-50 border border-gray-200 rounded-xl p-3 text-gray-800 font-semibold focus:outline-none focus:ring-2 focus:ring-blue-500 transition">
            </div>
        </div>

        <!-- Action Button -->
        <div>
            <button type="button" onclick="sendTip()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3.5 px-4 rounded-xl shadow-lg shadow-blue-200 transition duration-200 flex items-center justify-center space-x-2">
                <span>Send Tip</span>
                <span>⚡</span>
            </button>
            <p class="text-center text-xs text-gray-400 mt-4">Secure Web3 Transaction 🛡️</p>
        </div>

    </div>

    <!-- Wallet Selection Modal -->
    <div id="walletModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl border border-gray-100">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-bold text-gray-900">Connect Wallet</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 font-bold text-lg">&times;</button>
            </div>
            <p class="text-xs text-gray-500 mb-4">Choose your preferred wallet to connect with mazi_tip.</p>
            <div class="space-y-2">
                <button onclick="connectWallet('MetaMask')" class="w-full flex items-center justify-between p-3 bg-gray-50 hover:bg-blue-50 border border-gray-200 rounded-xl font-medium text-gray-800 transition">
                    <span>MetaMask</span>
                    <span class="text-xs text-blue-600 font-semibold">Popular</span>
                </button>
                <button onclick="connectWallet('Bitget')" class="w-full flex items-center justify-between p-3 bg-gray-50 hover:bg-blue-50 border border-gray-200 rounded-xl font-medium text-gray-800 transition">
                    <span>Bitget Wallet</span>
                </button>
                <button onclick="connectWallet('WalletConnect')" class="w-full flex items-center justify-between p-3 bg-gray-50 hover:bg-blue-50 border border-gray-200 rounded-xl font-medium text-gray-800 transition">
                    <span>WalletConnect</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        let connectedAccount = null;

        function setAmount(val) {
            document.getElementById('customAmount').value = val;
        }

        function handleTokenChange() {
            const token = document.getElementById('tokenSelect').value;
            const presetSection = document.getElementById('presetSection');
            if (token === 'USDC') {
                presetSection.style.display = 'block';
            } else {
                presetSection.style.display = 'none';
            }
        }

        function toggleWallet() {
            if (connectedAccount) {
                connectedAccount = null;
                const btn = document.getElementById('walletBtn');
                btn.innerText = "Connect Wallet";
                btn.className = "px-3 py-1.5 bg-blue-50 hover:bg-blue-100 border border-blue-200 text-blue-700 text-xs font-semibold rounded-xl transition";
                btn.title = "";
            } else {
                document.getElementById('walletModal').style.display = 'flex';
            }
        }

        function closeModal() {
            document.getElementById('walletModal').style.display = 'none';
        }

        async function connectWallet(walletName) {
            closeModal();
            if (typeof window.ethereum !== 'undefined') {
                try {
                    const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                    connectedAccount = accounts[0];
                    
                    const shortAddr = connectedAccount.substring(0, 6) + '...' + connectedAccount.substring(connectedAccount.length - 4);
                    
                    const btn = document.getElementById('walletBtn');
                    btn.innerText = shortAddr;
                    btn.className = "px-3 py-1.5 bg-green-50 hover:bg-red-50 border border-green-200 hover:border-red-200 text-green-700 hover:text-red-700 text-xs font-semibold rounded-xl transition";
                    btn.title = "Click to Disconnect";

                    try {
                        await window.ethereum.request({
                            method: 'wallet_switchEthereumChain',
                            params: [{ chainId: '0x...' }],
                        });
                    } catch (switchError) {
                        console.log("Network switch prompt handled");
                    }

                } catch (error) {
                    console.error("User denied account access", error);
                }
            } else {
                alert(walletName + " not detected! Please install the extension.");
            }
        }

        function sendTip() {
            if (!connectedAccount) {
                alert("Please connect your wallet first!");
                toggleWallet();
                return;
            }
            const amount = document.getElementById('customAmount').value;
            if (!amount || amount <= 0) {
                alert("Please enter a valid tip amount!");
                return;
            }
            alert("Initiating secure transfer of " + amount + " on Arc Testnet...");
        }
    </script>
</body>
</html>
